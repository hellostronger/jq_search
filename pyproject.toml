[project]
name = "treewiki"
version = "0.1.0"
description = "LLMWiki × PageIndex：无向量、树索引推理检索 + 持久 wiki 知识库"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tw = "treewiki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["treewiki*"]

[tool.setuptools.package-data]
treewiki = ["web/static/*"]
